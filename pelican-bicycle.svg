<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- 天空 -->
  <rect width="800" height="500" fill="#bfe8f7"/>
  <circle cx="690" cy="80" r="42" fill="#ffd94d"/>
  <circle cx="690" cy="80" r="56" fill="#ffd94d" opacity="0.25"/>

  <!-- 云（向左飘，营造前进感） -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -900 0" dur="14s" repeatCount="indefinite"/>
      <g>
        <ellipse cx="150" cy="90" rx="46" ry="20"/>
        <ellipse cx="185" cy="80" rx="34" ry="16"/>
        <ellipse cx="120" cy="80" rx="28" ry="14"/>
      </g>
      <g transform="translate(450,60)">
        <ellipse cx="150" cy="90" rx="40" ry="17"/>
        <ellipse cx="180" cy="82" rx="28" ry="13"/>
      </g>
      <g transform="translate(900,0)">
        <ellipse cx="150" cy="90" rx="46" ry="20"/>
        <ellipse cx="185" cy="80" rx="34" ry="16"/>
        <ellipse cx="120" cy="80" rx="28" ry="14"/>
      </g>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="450" width="800" height="50" fill="#8ecb7d"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#5da24e" stroke-width="6"
    stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" values="0;-70" dur="0.6s"
      repeatCount="indefinite"/>
  </line>

  <!-- ============ 自行车 ============ -->
  <g stroke-linecap="round">
    <!-- 后轮 -->
    <g>
      <circle cx="250" cy="380" r="70" fill="none" stroke="#333" stroke-width="10"/>
      <circle cx="250" cy="380" r="8" fill="#333"/>
      <g stroke="#666" stroke-width="4">
        <animateTransform attributeName="transform" type="rotate"
          from="0 250 380" to="360 250 380" dur="1.2s" repeatCount="indefinite"/>
        <line x1="250" y1="318" x2="250" y2="442"/>
        <line x1="196" y1="349" x2="304" y2="411"/>
        <line x1="196" y1="411" x2="304" y2="349"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g>
      <circle cx="550" cy="380" r="70" fill="none" stroke="#333" stroke-width="10"/>
      <circle cx="550" cy="380" r="8" fill="#333"/>
      <g stroke="#666" stroke-width="4">
        <animateTransform attributeName="transform" type="rotate"
          from="0 550 380" to="360 550 380" dur="1.2s" repeatCount="indefinite"/>
        <line x1="550" y1="318" x2="550" y2="442"/>
        <line x1="496" y1="349" x2="604" y2="411"/>
        <line x1="496" y1="411" x2="604" y2="349"/>
      </g>
    </g>
    <!-- 车架 -->
    <g stroke="#d23c3c" stroke-width="9" fill="none">
      <line x1="250" y1="380" x2="400" y2="380"/>
      <line x1="250" y1="380" x2="425" y2="268"/>
      <line x1="425" y1="268" x2="400" y2="380"/>
      <line x1="425" y1="268" x2="522" y2="282"/>
      <line x1="522" y1="282" x2="400" y2="380"/>
      <line x1="522" y1="282" x2="550" y2="380"/>
    </g>
    <!-- 车座与车把 -->
    <line x1="408" y1="262" x2="442" y2="262" stroke="#333" stroke-width="10"/>
    <path d="M522 282 L512 240 M512 240 q-4 -14 12 -16" stroke="#333" stroke-width="8" fill="none"/>
    <!-- 牙盘与脚踏（旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 400 380" to="360 400 380" dur="1.2s" repeatCount="indefinite"/>
      <circle cx="400" cy="380" r="14" fill="#f4a261" stroke="#333" stroke-width="4"/>
      <line x1="400" y1="380" x2="428" y2="380" stroke="#333" stroke-width="6"/>
      <line x1="400" y1="380" x2="372" y2="380" stroke="#333" stroke-width="6"/>
      <rect x="420" y="374" width="18" height="10" rx="3" fill="#333"/>
      <rect x="362" y="374" width="18" height="10" rx="3" fill="#333"/>
    </g>
  </g>

  <!-- ============ 鹈鹕（整体上下颠簸） ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -6; 0 0" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>

    <!-- 尾巴 -->
    <path d="M382 280 q-34 -6 -46 14 q22 4 34 16 q6 -16 12 -30 z" fill="#f1f1f1" stroke="#ccc" stroke-width="2"/>

    <!-- 身体 -->
    <ellipse cx="432" cy="282" rx="56" ry="40" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>

    <!-- 翅膀（扇动） -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 420 270; -14 420 270; 0 420 270" keyTimes="0;0.5;1"
        dur="0.6s" repeatCount="indefinite"/>
      <path d="M470 268 q-30 -34 -78 -22 q18 30 46 40 q20 6 32 -18 z"
        fill="#eef3f6" stroke="#c9d4da" stroke-width="3"/>
    </g>

    <!-- 脖子 -->
    <path d="M470 262 q26 -18 24 -52" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <path d="M470 262 q26 -18 24 -52" fill="none" stroke="#d9d9d9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- 头 -->
    <circle cx="498" cy="202" r="22" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
    <!-- 头顶小羽冠 -->
    <path d="M486 184 q-8 -12 2 -16 M496 182 q-2 -14 8 -16" stroke="#d9d9d9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 眼睛（眨眼） -->
    <circle cx="506" cy="196" r="4.5" fill="#222">
      <animate attributeName="ry" values="4.5;4.5;0.5;4.5;4.5" keyTimes="0;0.9;0.93;0.96;1" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- 上喙 -->
    <path d="M516 198 L612 206 Q616 208 612 211 L516 210 Z" fill="#f4a261" stroke="#d18a4e" stroke-width="2"/>
    <!-- 喉囊（下喙，随颠簸轻微晃动） -->
    <path fill="#f7b267" stroke="#d18a4e" stroke-width="2"
      d="M516 210 Q560 246 606 213 Q560 226 516 210 Z">
      <animate attributeName="d"
        values="M516 210 Q560 246 606 213 Q560 226 516 210 Z;
                M516 210 Q560 254 606 213 Q560 228 516 210 Z;
                M516 210 Q560 246 606 213 Q560 226 516 210 Z"
        keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- 腿：跟随脚踏做圆周运动（与牙盘同周期 1.2s） -->
    <!-- 右腿（相位 0） -->
    <line x1="424" y1="308" x2="428" y2="380" stroke="#f4a261" stroke-width="9" stroke-linecap="round">
      <animate attributeName="x2" values="428;400;372;400;428" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="380;408;380;352;380" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <!-- 左腿（相位 180°） -->
    <line x1="416" y1="310" x2="372" y2="380" stroke="#e08e45" stroke-width="9" stroke-linecap="round">
      <animate attributeName="x2" values="372;400;428;400;372" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="380;352;380;408;380" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <!-- 脚蹼 -->
    <ellipse cx="428" cy="382" rx="11" ry="5" fill="#e08e45">
      <animate attributeName="cx" values="428;400;372;400;428" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="382;410;382;354;382" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="372" cy="382" rx="11" ry="5" fill="#d18a4e">
      <animate attributeName="cx" values="372;400;428;400;372" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="382;354;382;410;382" keyTimes="0;0.25;0.5;0.75;1" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="300" x2="130" y2="300">
      <animate attributeName="x1" values="130;20" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200;90" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="40" y1="340" x2="110" y2="340">
      <animate attributeName="x1" values="110;0" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="180;70" dur="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.4s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
