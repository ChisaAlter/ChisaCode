<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>鹈鹕骑自行车</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #22303c;
    font-family: "Segoe UI", "PingFang SC", sans-serif;
  }
  .stage {
    width: min(92vw, 960px);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ea" />
      <stop offset="0.6" stop-color="#c9ecf0" />
      <stop offset="1" stop-color="#fdf3d8" />
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)" />

  <!-- 太阳 -->
  <g>
    <g stroke="#f9c74f" stroke-width="6" stroke-linecap="round">
      <line x1="680" y1="18" x2="680" y2="34" />
      <line x1="680" y1="126" x2="680" y2="142" />
      <line x1="608" y1="80" x2="624" y2="80" />
      <line x1="736" y1="80" x2="752" y2="80" />
      <line x1="629" y1="29" x2="640" y2="40" />
      <line x1="720" y1="120" x2="731" y2="131" />
      <line x1="731" y1="29" x2="720" y2="40" />
      <line x1="640" y1="120" x2="629" y2="131" />
      <animateTransform attributeName="transform" type="rotate"
        from="0 680 80" to="360 680 80" dur="36s" repeatCount="indefinite" />
    </g>
    <circle cx="680" cy="80" r="34" fill="#ffd166" />
    <circle cx="680" cy="80" r="27" fill="#ffe08a" />
  </g>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="160" cy="90" rx="46" ry="20" />
      <ellipse cx="196" cy="80" rx="34" ry="17" />
      <ellipse cx="128" cy="82" rx="26" ry="14" />
      <animateTransform attributeName="transform" type="translate"
        from="880 0" to="-260 0" dur="30s" begin="-22s" repeatCount="indefinite" />
    </g>
  </g>
  <g fill="#ffffff" opacity="0.8">
    <g>
      <ellipse cx="420" cy="140" rx="56" ry="22" />
      <ellipse cx="462" cy="130" rx="36" ry="18" />
      <ellipse cx="384" cy="132" rx="30" ry="15" />
      <animateTransform attributeName="transform" type="translate"
        from="880 0" to="-300 0" dur="38s" begin="-8s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- 远山与地面 -->
  <ellipse cx="170" cy="450" rx="320" ry="110" fill="#b8dcae" />
  <ellipse cx="620" cy="460" rx="340" ry="120" fill="#a5d19b" />
  <rect x="0" y="436" width="800" height="64" fill="#ecdcb4" />
  <rect x="0" y="436" width="800" height="5" fill="#d9c493" />

  <!-- 路面虚线，向后滚动 -->
  <line x1="0" y1="472" x2="800" y2="472" stroke="#fffdf4" stroke-width="7"
    stroke-linecap="round" stroke-dasharray="44 36">
    <animate attributeName="stroke-dashoffset" from="0" to="80"
      dur="0.7s" repeatCount="indefinite" />
  </line>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="200" x2="180" y2="200">
      <animateTransform attributeName="transform" type="translate"
        from="860 0" to="-320 0" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="100" y1="300" x2="190" y2="300">
      <animateTransform attributeName="transform" type="translate"
        from="860 0" to="-320 0" dur="0.9s" begin="-0.4s" repeatCount="indefinite" />
    </line>
    <line x1="140" y1="360" x2="200" y2="360">
      <animateTransform attributeName="transform" type="translate"
        from="860 0" to="-320 0" dur="1.3s" begin="-0.8s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- ========== 自行车 ========== -->
  <g>
    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="378" r="55" fill="none" stroke="#33424f" stroke-width="10" />
      <g stroke="#c9d4dd" stroke-width="3">
        <line x1="300" y1="328" x2="300" y2="428" />
        <line x1="257" y1="353" x2="343" y2="403" />
        <line x1="257" y1="403" x2="343" y2="353" />
        <animateTransform attributeName="transform" type="rotate"
          from="0 300 378" to="360 300 378" dur="1.2s" repeatCount="indefinite" />
      </g>
      <circle cx="300" cy="378" r="7" fill="#33424f" />
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="520" cy="378" r="55" fill="none" stroke="#33424f" stroke-width="10" />
      <g stroke="#c9d4dd" stroke-width="3">
        <line x1="520" y1="328" x2="520" y2="428" />
        <line x1="477" y1="353" x2="563" y2="403" />
        <line x1="477" y1="403" x2="563" y2="353" />
        <animateTransform attributeName="transform" type="rotate"
          from="0 520 378" to="360 520 378" dur="1.2s" repeatCount="indefinite" />
      </g>
      <circle cx="520" cy="378" r="7" fill="#33424f" />
    </g>

    <!-- 车架 -->
    <g stroke="#ff6f61" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="300" y1="378" x2="390" y2="378" />
      <line x1="390" y1="378" x2="368" y2="305" />
      <line x1="300" y1="378" x2="368" y2="305" />
      <line x1="368" y1="305" x2="502" y2="313" />
      <line x1="390" y1="378" x2="502" y2="313" />
      <line x1="502" y1="313" x2="520" y2="378" />
    </g>

    <!-- 车把 -->
    <path d="M502 313 Q 524 300 519 285" fill="none" stroke="#ff6f61"
      stroke-width="7" stroke-linecap="round" />
    <circle cx="519" cy="283" r="7" fill="#33424f" />

    <!-- 车座 -->
    <ellipse cx="366" cy="300" rx="22" ry="8" fill="#4a3b33" />

    <!-- 牙盘 -->
    <circle cx="390" cy="378" r="14" fill="none" stroke="#8896a6" stroke-width="4" />

    <!-- 曲柄组：脚蹬与鹈鹕的蹼足，绕五通旋转 -->
    <g>
      <line x1="390" y1="358" x2="390" y2="398" stroke="#33424f" stroke-width="5"
        stroke-linecap="round" />
      <ellipse cx="390" cy="356" rx="11" ry="6" fill="#f2944f" />
      <ellipse cx="390" cy="400" rx="11" ry="6" fill="#f2944f" />
      <circle cx="390" cy="378" r="5" fill="#33424f" />
      <animateTransform attributeName="transform" type="rotate"
        from="0 390 378" to="360 390 378" dur="1.2s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- ========== 鹈鹕（随车节奏上下颠动） ========== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -5; 0 0" keyTimes="0; 0.5; 1" dur="0.6s" repeatCount="indefinite" />

    <!-- 尾羽 -->
    <path d="M338 240 Q 304 224 292 238 Q 310 250 336 252 Z" fill="#e9e2d2" />

    <!-- 身体 -->
    <ellipse cx="400" cy="252" rx="80" ry="52" fill="#fdf8ec"
      transform="rotate(-7 400 252)" />

    <!-- 侧腹阴影 -->
    <path d="M342 272 Q 400 306 452 268 Q 400 288 342 272 Z" fill="#efe7d4" />

    <!-- 踩动的腿（前后两条，交替画圈踩踏） -->
    <g stroke="#e8a85c" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M374 292 Q 380 340 386 390">
        <animateTransform attributeName="transform" type="rotate"
          values="12 384 288; -10 384 288; 12 384 288" keyTimes="0; 0.5; 1"
          dur="1.2s" repeatCount="indefinite" />
      </path>
      <path d="M390 292 Q 400 322 393 354">
        <animateTransform attributeName="transform" type="rotate"
          values="-10 392 288; 12 392 288; -10 392 288" keyTimes="0; 0.5; 1"
          dur="1.2s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- 脖子 -->
    <path d="M444 252 C 474 228 478 200 470 172" fill="none" stroke="#fdf8ec"
      stroke-width="32" stroke-linecap="round" />

    <!-- 撑住车把的翅膀，随踩踏微微扇动 -->
    <g>
      <path d="M442 262 Q 482 272 512 286" fill="none" stroke="#e9e2d2"
        stroke-width="22" stroke-linecap="round" />
      <circle cx="516" cy="286" r="11" fill="#e9e2d2" />
      <animateTransform attributeName="transform" type="rotate"
        values="-4 442 262; 7 442 262; -4 442 262" keyTimes="0; 0.5; 1"
        dur="1.2s" repeatCount="indefinite" />
    </g>

    <!-- 头 -->
    <circle cx="472" cy="158" r="24" fill="#fdf8ec" />

    <!-- 骑行小帽 -->
    <path d="M450 150 Q 452 128 472 127 Q 492 129 494 148 Z" fill="#4ecdc4" />
    <path d="M492 142 L 514 148 L 494 151 Z" fill="#3fb3aa" />

    <!-- 头顶羽冠 -->
    <path d="M458 138 Q 448 126 452 116 M468 135 Q 464 122 470 114"
      fill="none" stroke="#fdf8ec" stroke-width="6" stroke-linecap="round" />

    <!-- 标志性长喙（上喙 + 喉囊） -->
    <path d="M490 146 Q 540 150 568 163 L 564 172 Q 524 163 488 157 Z"
      fill="#f2944f" />
    <path d="M488 158 Q 528 166 560 171 Q 544 202 504 198 Q 488 182 488 158 Z"
      fill="#f9b881" />
    <path d="M560 171 Q 568 173 571 168" fill="none" stroke="#d97b3a"
      stroke-width="3" stroke-linecap="round" />

    <!-- 会眨的眼睛 -->
    <ellipse cx="480" cy="150" rx="4.2" ry="4.2" fill="#243447">
      <animate attributeName="ry" values="4.2;4.2;0.5;4.2;4.2"
        keyTimes="0;0.88;0.92;0.96;1" dur="4s" repeatCount="indefinite" />
    </ellipse>
    <circle cx="481.5" cy="148.5" r="1.4" fill="#ffffff" />
  </g>

  <!-- 标题 -->
  <text x="400" y="487" text-anchor="middle" font-size="20" fill="#8a7a52"
    font-family="inherit" letter-spacing="4">鹈鹕的骑行日记</text>
</svg>
</div>
</body>
</html>
