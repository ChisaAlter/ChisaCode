</main>
<script>
const el=id=>document.getElementById(id);
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let running=!motion.matches,time=0,previous=null,request=null;
function paint(){
 const a=time*Math.PI*2/1.65,d=a*180/Math.PI,b=Math.sin(a*2)*2;
 el('rear').setAttribute('transform',`rotate(${d*1.4})`);el('front').setAttribute('transform',`rotate(${d*1.4})`);
 el('crank').setAttribute('transform',`rotate(${d} 491 461)`);el('bird').setAttribute('transform',`translate(0 ${b})`);
 const x=491+Math.cos(a)*30,y=461+Math.sin(a)*30,fx=982-x,fy=922-y;
 el('leg').setAttribute('d',`M457 ${330+b}Q433 351 ${439+Math.cos(a)*10} ${387+Math.sin(a)*13}L${x} ${y}`);
 el('far-leg').setAttribute('d',`M477 ${331+b}Q508 357 ${514-Math.cos(a)*10} ${389-Math.sin(a)*13}L${fx} ${fy}`);
 el('foot').setAttribute('d',`M${x-4} ${y}h23l-5-5`);el('pedal').setAttribute('d',`M${x-10} ${y+7}h29`);el('far-pedal').setAttribute('d',`M${fx-12} ${fy+5}h26`);
 el('scarf').setAttribute('d',`M541 207Q510 ${188+Math.sin(a*2)*8} 475 ${203+Math.sin(a*2+1)*7}L462 ${223+Math.sin(a*2+1)*7}L485 222Q512 ${227+Math.sin(a*2)*5} 545 217`);
 el('road').setAttribute('transform',`translate(${-((time*95)%180)} 0)`);
}
function frame(stamp){if(previous!==null)time+=Math.min((stamp-previous)/1000,.05)*Number(el('speed').value);previous=stamp;paint();request=requestAnimationFrame(frame)}
function sync(){el('toggle').textContent=running?'\u275a\u275a':'\u25b6';const label=running?'\u6682\u505c\u52a8\u753b':'\u64ad\u653e\u52a8\u753b';el('toggle').setAttribute('aria-label',label);el('toggle').title=label;cancelAnimationFrame(request);previous=null;if(running&&!document.hidden)request=requestAnimationFrame(frame)}
el('toggle').addEventListener('click',()=>{running=!running;sync()});el('speed').addEventListener('input',event=>{el('value').value=`${event.target.value}x`});document.addEventListener('visibilitychange',sync);motion.addEventListener('change',event=>{running=!event.matches;sync()});paint();sync();
</script>
