<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0e1420;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: min(92vw, 900px);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    display: block;
  }
  svg * { transform-box: view-box; }

  /* ---- motion ---- */
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  @keyframes crankSpin { to { transform: rotate(360deg); } }
  @keyframes legPedal {
    0%     { transform: rotate(0deg); }
    12.5%  { transform: rotate(6.7deg); }
    25%    { transform: rotate(15.7deg); }
    37.5%  { transform: rotate(23.9deg); }
    50%    { transform: rotate(28.1deg); }
    62.5%  { transform: rotate(23.6deg); }
    75%    { transform: rotate(9.5deg); }
    87.5%  { transform: rotate(-0.6deg); }
    100%   { transform: rotate(0deg); }
  }
  @keyframes bodyBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes wingFlap {
    0%, 100% { transform: rotate(4deg); }
    50%      { transform: rotate(-9deg); }
  }
  @keyframes pouchSway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2.5deg); }
  }
  @keyframes dashFlow { to { stroke-dashoffset: 92; } }
  @keyframes hillsDrift  { to { transform: translateX(-800px); } }
  @keyframes cloudsDrift { from { transform: translateX(-260px); } to { transform: translateX(940px); } }
  @keyframes sunRays { to { transform: rotate(360deg); } }

  .wheel      { animation: wheelSpin 1.2s linear infinite; }
  .crank      { animation: crankSpin 3s linear infinite; transform-origin: 380px 395px; }
  .leg-near   { animation: legPedal 3s linear infinite; transform-origin: 360px 295px; }
  .leg-far    { animation: legPedal 3s linear infinite; transform-origin: 352px 297px; animation-delay: -1.5s; }
  .pelican    { animation: bodyBob 1.5s ease-in-out infinite; }
  .wing       { animation: wingFlap 1.1s ease-in-out infinite; transform-origin: 322px 244px; }
  .pouch      { animation: pouchSway 1.8s ease-in-out infinite; transform-origin: 414px 204px; }
  .dashes     { animation: dashFlow 0.9s linear infinite; }
  .hills-far  { animation: hillsDrift 26s linear infinite; }
  .hills-near { animation: hillsDrift 15s linear infinite; }
  .rays       { animation: sunRays 60s linear infinite; transform-origin: 130px 100px; }
  .cloud { animation: cloudsDrift linear infinite; }
  .cloud-1 { animation-duration: 48s; animation-delay: -16s; }
  .cloud-2 { animation-duration: 72s; animation-delay: -40s; }
  .cloud-3 { animation-duration: 58s; animation-delay: -5s; }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3ff"/>
      <stop offset="0.7" stop-color="#e6f6ff"/>
      <stop offset="1" stop-color="#fff6df"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <g class="rays" stroke="#ffcf3d" stroke-width="5" stroke-linecap="round">
    <path d="M130 38 V24 M130 176 V162 M68 100 H54 M206 100 H192"/>
    <path d="M87 57 L77 47 M183 153 L173 143 M87 143 L77 153 M183 57 L173 47"/>
  </g>
  <circle cx="130" cy="100" r="38" fill="#ffd94d"/>

  <!-- clouds -->
  <g class="cloud cloud-1" fill="#ffffff" opacity="0.92">
    <ellipse cx="0" cy="95" rx="34" ry="15"/><ellipse cx="26" cy="102" rx="28" ry="12"/><ellipse cx="-26" cy="103" rx="24" ry="11"/>
  </g>
  <g class="cloud cloud-2" fill="#ffffff" opacity="0.85">
    <ellipse cx="0" cy="155" rx="28" ry="12"/><ellipse cx="22" cy="161" rx="22" ry="10"/><ellipse cx="-21" cy="162" rx="19" ry="9"/>
  </g>
  <g class="cloud cloud-3" fill="#ffffff" opacity="0.9">
    <ellipse cx="0" cy="60" rx="30" ry="13"/><ellipse cx="24" cy="67" rx="24" ry="10"/><ellipse cx="-23" cy="68" rx="20" ry="9"/>
  </g>

  <!-- far hills (parallax) -->
  <g class="hills-far" fill="#b7dcc0">
    <path d="M0 415 Q130 355 260 415 T520 415 T780 415 T1040 415 T1300 415 T1560 415 T1820 415 V500 H0 Z"/>
  </g>
  <!-- near hills -->
  <g class="hills-near" fill="#8fca9b">
    <path d="M0 432 Q170 382 340 432 T680 432 T1020 432 T1360 432 T1700 432 V500 H0 Z"/>
  </g>

  <!-- road -->
  <rect x="0" y="440" width="800" height="60" fill="#8d99a6"/>
  <rect x="0" y="440" width="800" height="5" fill="#7b8794"/>
  <line class="dashes" x1="0" y1="470" x2="800" y2="470" stroke="#f4f6f8" stroke-width="6"
        stroke-dasharray="46 46" stroke-dashoffset="0"/>

  <!-- rear wheel -->
  <g class="wheel" style="transform-origin:235px 390px">
    <circle cx="235" cy="390" r="58" fill="none" stroke="#2b2f36" stroke-width="7"/>
    <path d="M235 337 V443 M182 390 H288 M197.5 352.5 L272.5 427.5 M272.5 352.5 L197.5 427.5"
          stroke="#5b6572" stroke-width="3.5"/>
    <circle cx="235" cy="390" r="8" fill="#2b2f36"/>
  </g>
  <!-- front wheel -->
  <g class="wheel" style="transform-origin:525px 390px">
    <circle cx="525" cy="390" r="58" fill="none" stroke="#2b2f36" stroke-width="7"/>
    <path d="M525 337 V443 M472 390 H578 M487.5 352.5 L562.5 427.5 M562.5 352.5 L487.5 427.5"
          stroke="#5b6572" stroke-width="3.5"/>
    <circle cx="525" cy="390" r="8" fill="#2b2f36"/>
  </g>

  <!-- frame -->
  <g stroke="#ff6a3d" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M235 390 L380 395 L488 292 M380 395 L305 302 M235 390 L305 302 M525 390 L488 292"/>
    <path d="M488 292 L496 262"/>
  </g>
  <path d="M495 262 Q497 254 506 256" stroke="#2b2f36" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- saddle -->
  <path d="M286 297 Q307 287 328 297 Q323 307 307 308 Q292 307 286 297 Z" fill="#2b2f36"/>

  <!-- crank + pedals -->
  <g class="crank">
    <circle cx="380" cy="395" r="11" fill="none" stroke="#2b2f36" stroke-width="5"/>
    <path d="M380 395 L406 395 M380 395 L354 395" stroke="#2b2f36" stroke-width="5" stroke-linecap="round"/>
    <rect x="398" y="390" width="16" height="9" rx="3" fill="#2b2f36"/>
    <rect x="346" y="390" width="16" height="9" rx="3" fill="#2b2f36"/>
  </g>

  <!-- far leg (behind body) -->
  <g class="leg-far" stroke="#c47a2e" stroke-width="7" stroke-linecap="round">
    <path d="M352 297 L356 392" fill="none"/>
    <ellipse cx="354" cy="394" rx="12" ry="6.5" fill="#c47a2e" stroke="none"/>
  </g>

  <!-- pelican -->
  <g class="pelican">
    <!-- tail feathers -->
    <path d="M285 252 Q252 240 240 224 Q262 228 280 238 Z" fill="#d7e3ee"/>
    <path d="M287 262 Q252 258 238 246 Q262 246 282 250 Z" fill="#c5d6e6"/>
    <!-- arm reaching the handlebar -->
    <path d="M386 244 Q438 236 492 252" stroke="#d7e3ee" stroke-width="9" stroke-linecap="round" fill="none"/>
    <ellipse cx="496" cy="253" rx="9" ry="6.5" fill="#c5d6e6"/>
    <!-- body -->
    <ellipse cx="330" cy="268" rx="56" ry="42" fill="#f5f9fc" transform="rotate(-7 330 268)"/>
    <!-- neck -->
    <path d="M360 246 C374 218 386 206 400 199" stroke="#f5f9fc" stroke-width="24"
          stroke-linecap="round" fill="none"/>
    <!-- head -->
    <circle cx="404" cy="197" r="17" fill="#f5f9fc"/>
    <path d="M401 181 Q405 168 415 170 Q408 176 409 183 Z" fill="#d7e3ee"/>
    <!-- beak -->
    <path d="M410 191 Q444 193 476 204 L474 210 Q443 201 411 199 Z" fill="#f4a52a"/>
    <!-- pouch -->
    <path class="pouch" d="M411 199 Q442 201 471 209 Q470 226 449 229 Q424 226 413 210 Z"
          fill="#ef9648"/>
    <!-- eye -->
    <circle cx="398" cy="192" r="2.8" fill="#1c2733"/>
    <!-- flapping wing -->
    <path class="wing" d="M298 235 Q334 216 368 236 Q374 262 344 278 Q310 276 296 256 Z"
          fill="#d7e3ee" stroke="#b9cedd" stroke-width="2"/>
    <path d="M310 246 Q336 236 358 248" stroke="#b9cedd" stroke-width="2" fill="none"/>
  </g>

  <!-- near leg (over frame, foot on pedal) -->
  <g class="leg-near" stroke="#e8943c" stroke-width="7.5" stroke-linecap="round">
    <path d="M360 295 L404 392" fill="none"/>
    <ellipse cx="406" cy="394" rx="12.5" ry="6.5" fill="#e8943c" stroke="none"/>
  </g>
</svg>
</body>
</html>
