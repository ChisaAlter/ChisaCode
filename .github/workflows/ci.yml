name: CI

on:
  workflow_dispatch:

# Least-privilege: CI only needs to read code and actions metadata. Jobs that
# need to write (artifacts) grant that at the job level.
permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI does not use the CUDA execution provider, and the onnxruntime-node
  # postinstall download from NuGet is large enough to make npm ci flaky.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx oxfmt --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint lockfile
        run: npx --yes lockfile-lint --path package-lock.json --type npm --allowed-hosts npm --validate-https --validate-integrity

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies for critical vulnerabilities
        run: npm audit --audit-level=critical

  test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit test debt
        run: npm run test:audit

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build typecheck dependencies
        run: npm run build:server && npm run build --workspace=@chisacode/expo-two-way-audio

      - name: Typecheck all packages
        run: npm run typecheck

      - name: Verify public package contents
        run: |
          npm pack --dry-run --ignore-scripts --workspace=@chisacode/protocol
          npm pack --dry-run --ignore-scripts --workspace=@chisacode/client
          npm pack --dry-run --ignore-scripts --workspace=@chisacode/server

  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: server-tests (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Fetch origin/cn-main (worktree tests)
        run: git fetch --no-tags origin cn-main:refs/remotes/origin/cn-main

      - name: Install dependencies
        run: npm ci

      - name: Install agent CLIs for provider tests
        run: npm install -g @anthropic-ai/claude-code opencode-ai

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Run server tests
        run: npm run test --workspace=@chisacode/server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build server stack
        run: npm run build:server

      - name: Run desktop tests
        run: npm run test --workspace=@chisacode/desktop

  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Run app unit tests
        run: npm run test --workspace=@chisacode/app

  sdk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client dependencies
        run: npm run build:client

      - name: Run protocol tests
        run: npm run test --workspace=@chisacode/protocol

      - name: Run client tests
        run: npm run test --workspace=@chisacode/client

      - name: Typecheck client examples
        run: npm run typecheck:examples --workspace=@chisacode/client

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build server stack
        run: npm run build:server

      - name: Install agent CLIs for provider tests
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run Playwright E2E tests
        run: npm run test:e2e --workspace=@chisacode/app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  desktop-chain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install agent CLIs for desktop chain
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run desktop chain tests
        run: npm run test:desktop-chain
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload desktop chain artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-chain-results
          path: |
            packages/app/test-results/
            packages/app/playwright-report/
          retention-days: 7

  android-maestro-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Build server stack
        run: npm run build:server

      - name: Start daemon for Android chain
        shell: bash
        run: |
          set -euo pipefail
          export CHISACODE_HOME="$RUNNER_TEMP/chisacode-android-chain-home"
          export CHISACODE_LISTEN="127.0.0.1:6767"
          export CHISACODE_LOCAL_SPEECH_AUTO_DOWNLOAD=0
          export CHISACODE_DICTATION_ENABLED=0
          export CHISACODE_VOICE_MODE_ENABLED=0
          mkdir -p "$CHISACODE_HOME"
          npm run start --workspace=@chisacode/server > "$RUNNER_TEMP/chisacode-android-daemon.log" 2>&1 &
          echo "daemon_pid=$!" >> "$GITHUB_ENV"
          for i in {1..120}; do
            if node -e "const net=require('net'); const s=net.connect(6767,'127.0.0.1',()=>process.exit(0)); s.on('error',()=>process.exit(1)); s.setTimeout(1000,()=>process.exit(1));"; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/chisacode-android-daemon.log"
          exit 1

      - name: Run Android Maestro chain
        # Pinned to v2.37.0 for supply-chain safety. Update by bumping both
        # the SHA and the trailing tag comment together.
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        env:
          CHISACODE_MAESTRO_APP_ID: sh.chisacode.debug
          CHISACODE_MAESTRO_DIRECT_ENDPOINT: 127.0.0.1:6767
          CHISACODE_MAESTRO_DAEMON_WS_URL: ws://127.0.0.1:6767/ws
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            export PATH="$PATH:/home/runner/.maestro/bin"
            npm run android:development --workspace=@chisacode/app
            npm run test:android-chain

      - name: Stop Android daemon
        if: always()
        shell: bash
        run: |
          if [ -n "${daemon_pid:-}" ]; then
            kill "$daemon_pid" >/dev/null 2>&1 || true
          fi

      - name: Upload Android chain artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-chain-results
          path: |
            /tmp/chisacode-workspace-create-android-*/
            ${{ runner.temp }}/chisacode-android-daemon.log
          retention-days: 7

  relay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build relay
        run: npm run build:relay

      - name: Run relay tests
        run: npm run test --workspace=@chisacode/relay

  cli-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    name: cli-tests (shard ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install agent CLIs for provider tests
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.105.0 opencode-ai

      - name: Run CLI tests
        run: npm run test --workspace=@chisacode/cli
        env:
          CHISACODE_LOCAL_SPEECH_AUTO_DOWNLOAD: "0"
          CHISACODE_DICTATION_ENABLED: "0"
          CHISACODE_VOICE_MODE_ENABLED: "0"
          CHISACODE_CLI_TEST_SHARD: ${{ matrix.shard }}
          CHISACODE_CLI_TEST_SHARD_TOTAL: "3"

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Detect unused exports and dependencies
        run: npm run knip -- --include dependencies,unlisted,unresolved,binaries

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning
        # Pinned to v3.95.8 for supply-chain safety. Update by bumping both
        # the SHA and the trailing tag comment together.
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --only-verified
