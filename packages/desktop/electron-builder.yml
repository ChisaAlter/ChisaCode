npmRebuild: false
appId: sh.paseo.desktop
productName: Fleurdelys
executableName: Fleurdelys
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@fleurdelys/*/src/**"
  - "!node_modules/@fleurdelys/**/*.test.*"
  - "!node_modules/@fleurdelys/**/*.spec.*"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@fleurdelys/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: ../../skills
    to: skills
publish:
  provider: github
  owner: getpaseo
  repo: paseo
mac:
  artifactName: "Fleurdelys-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extraResources:
    - from: bin/fleurdelys
      to: bin/fleurdelys
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "Fleurdelys-${version}-${arch}.${ext}"
  maintainer: "Mohamed Boudra <hello@moboudra.com>"
  vendor: "Fleurdelys"
  extraResources:
    - from: bin/fleurdelys
      to: bin/fleurdelys
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
win:
  artifactName: "Fleurdelys-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  extraResources:
    - from: bin/fleurdelys.cmd
      to: bin/fleurdelys.cmd
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
